services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: TuPassword123
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "sglplus -s system/TuPassword123@//localhost:1521/FREEPDB1"]
      interval: 15s
      timeout: 10s
volumes:
  oracle-data: